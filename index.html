<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hard Backrooms Horror</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    background:rgba(0,0,0,0.45);
    padding:12px;
    border-radius:12px;
    z-index:10;
}

#crosshair{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:22px;
    z-index:10;
}

#inventory{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
}

.slot{
    width:60px;
    height:60px;
    border:2px solid white;
    border-radius:10px;
    background:rgba(0,0,0,0.4);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

#staminaBox{
    position:absolute;
    bottom:100px;
    left:20px;
    width:220px;
    height:24px;
    border:2px solid white;
    background:black;
}

#stamina{
    width:100%;
    height:100%;
    background:lime;
}

#msg{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:45px;
    color:red;
    display:none;
    z-index:20;
    text-align:center;
}
</style>
</head>
<body>

<div id="ui">
WASD = Move<br>
Arrow Keys = Look<br>
SHIFT = Run<br>
SPACE = Jump<br>
C = Crouch<br>
Collect 5 Keys To Escape
</div>

<div id="crosshair">+</div>

<div id="inventory">
<div class="slot" id="slot1"></div>
<div class="slot" id="slot2"></div>
<div class="slot" id="slot3"></div>
</div>

<div id="staminaBox">
<div id="stamina"></div>
</div>

<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x4f4726,20,180);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,2,0);

scene.add(camera);

const renderer = new THREE.WebGLRenderer({
antialias:false,
powerPreference:"high-performance"
});

renderer.setPixelRatio(0.7);

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(renderer.domElement);



// LIGHTS
scene.add(new THREE.AmbientLight(0xffffff,0.45));

for(let x=-180;x<=180;x+=60){

    for(let z=-180;z<=180;z+=60){

        const light = new THREE.PointLight(
            0xffeeaa,
            1,
            35
        );

        light.position.set(x,8,z);

        scene.add(light);
    }
}



// LIGHT FLICKER
setInterval(()=>{

scene.traverse(obj=>{

if(obj.type === "PointLight"){

obj.intensity =
0.4 + Math.random()*1.2;

}

});

},120);



// FLOOR
const floor = new THREE.Mesh(
new THREE.PlaneGeometry(500,500),
new THREE.MeshStandardMaterial({
color:0x8d8450
})
);

floor.rotation.x = -Math.PI/2;

scene.add(floor);



// CEILING
const ceiling = new THREE.Mesh(
new THREE.PlaneGeometry(500,500),
new THREE.MeshStandardMaterial({
color:0xcfc78c,
side:THREE.DoubleSide
})
);

ceiling.rotation.x = Math.PI/2;
ceiling.position.y = 10;

scene.add(ceiling);



// WALLS
const walls = [];

function createWall(x,z,w,d){

    const wall = new THREE.Mesh(
        new THREE.BoxGeometry(w,10,d),
        new THREE.MeshStandardMaterial({
            color:0xd8ca7a
        })
    );

    wall.position.set(x,5,z);

    scene.add(wall);

    walls.push({
        mesh:wall,
        w:w,
        d:d
    });
}



// MAP
createWall(0,-250,500,4);
createWall(0,250,500,4);
createWall(-250,0,4,500);
createWall(250,0,4,500);

for(let i=0;i<100;i++){

    let x = Math.random()*450-225;
    let z = Math.random()*450-225;

    createWall(
        x,
        z,
        Math.random()>0.5 ? 60 : 4,
        Math.random()>0.5 ? 4 : 60
    );
}



// EXIT
const exit = new THREE.Mesh(
new THREE.BoxGeometry(10,10,2),
new THREE.MeshBasicMaterial({
color:0x00ff00
})
);

exit.position.set(230,5,-230);

scene.add(exit);



// ITEMS
const items = [];
const batteriesItems = [];

let secretOrb;

function createKey(x,z){

    const key = new THREE.Mesh(
        new THREE.BoxGeometry(2,1,3),
        new THREE.MeshBasicMaterial({
            color:0x00ffff
        })
    );

    key.position.set(x,1,z);

    scene.add(key);

    items.push(key);
}

function createBattery(x,z){

    const battery = new THREE.Mesh(
        new THREE.CylinderGeometry(1,1,2,8),
        new THREE.MeshBasicMaterial({
            color:0xffff00
        })
    );

    battery.position.set(x,1,z);

    scene.add(battery);

    batteriesItems.push(battery);
}

function createSecretOrb(x,z){

    const orb = new THREE.Mesh(
        new THREE.SphereGeometry(2,16,16),
        new THREE.MeshBasicMaterial({
            color:0xff00ff
        })
    );

    orb.position.set(x,2,z);

    scene.add(orb);

    secretOrb = orb;
}



// HARDER KEY LOCATIONS
createKey(-220,-180);
createKey(180,-200);
createKey(200,180);
createKey(-190,190);
createKey(0,0);

createBattery(-180,40);
createBattery(100,-150);
createBattery(170,100);

createSecretOrb(-210,210);



// PLAYER ITEMS
let collected = 0;
let neededKeys = 5;

let batteries = 0;
let secretFound = false;



// MONSTER
const monster = new THREE.Mesh(
new THREE.BoxGeometry(6,9,6),
new THREE.MeshStandardMaterial({
color:0x111111
})
);

monster.position.set(-180,4,-180);

scene.add(monster);



// HORROR TEXT
const horrorText = document.createElement("div");

horrorText.style.position = "absolute";
horrorText.style.bottom = "20px";
horrorText.style.right = "20px";
horrorText.style.color = "white";
horrorText.style.opacity = "0.5";
horrorText.style.fontSize = "20px";

document.body.appendChild(horrorText);

setInterval(()=>{

const texts = [
"FOOTSTEPS...",
"RUN...",
"DONT LOOK BACK",
"ITS NEAR",
"BREATHING..."
];

horrorText.innerHTML =
texts[
Math.floor(
Math.random()*texts.length
)
];

},4000);



// CONTROLS
const keys = {};

document.addEventListener("keydown",(e)=>{

    keys[e.key.toLowerCase()] = true;

    if(e.code === "Space" && grounded){

        velocityY = 0.32;
        grounded = false;
    }

    if(e.key.toLowerCase() === "c"){

        crouching = true;
    }
});

document.addEventListener("keyup",(e)=>{

    keys[e.key.toLowerCase()] = false;

    if(e.key.toLowerCase() === "c"){

        crouching = false;
    }
});



// PLAYER
let yaw = 0;
let pitch = 0;
let speed = 0.22;

let stamina = 100;
let canRun = true;

let velocityY = 0;
let grounded = true;
let crouching = false;



// COLLISION
function collides(x,z){

    for(let wall of walls){

        let wx = wall.mesh.position.x;
        let wz = wall.mesh.position.z;

        if(
            Math.abs(x-wx) < wall.w/2 + 1 &&
            Math.abs(z-wz) < wall.d/2 + 1
        ){
            return true;
        }
    }

    return false;
}



// GAME LOOP
function animate(){

requestAnimationFrame(animate);



// LOOK
if(keys["arrowleft"]) yaw += 0.04;
if(keys["arrowright"]) yaw -= 0.04;

if(keys["arrowup"]) pitch += 0.02;
if(keys["arrowdown"]) pitch -= 0.02;

pitch = Math.max(-1.2,Math.min(1.2,pitch));

camera.rotation.order = "YXZ";

camera.rotation.y = yaw;
camera.rotation.x = pitch;



// STAMINA
let running =
keys["shift"] &&
canRun;

if(running){

    stamina -= 0.45;

}else{

    stamina += 0.22;
}

stamina = Math.max(
0,
Math.min(100,stamina)
);

if(stamina <= 0){

    canRun = false;
}

if(stamina >= 100){

    canRun = true;
}

document.getElementById(
"stamina"
).style.width =
stamina + "%";



// SPEED
let targetSpeed =
running ? 0.65 : 0.28;

speed += (targetSpeed-speed)*0.08;



// MOVE
let moveX = 0;
let moveZ = 0;

if(keys["w"]){

    moveX -= Math.sin(yaw)*speed;
    moveZ -= Math.cos(yaw)*speed;
}

if(keys["s"]){

    moveX += Math.sin(yaw)*speed;
    moveZ += Math.cos(yaw)*speed;
}

if(keys["a"]){

    moveX -= Math.cos(yaw)*speed;
    moveZ += Math.sin(yaw)*speed;
}

if(keys["d"]){

    moveX += Math.cos(yaw)*speed;
    moveZ -= Math.sin(yaw)*speed;
}



// WALK EFFECT
let moving =
keys["w"] || keys["s"] ||
keys["a"] || keys["d"];

if(moving && grounded){

    camera.position.y +=
    Math.sin(Date.now()*0.02)*0.03;
}



// FOV
camera.fov += (
(running ? 84 : 75)
-camera.fov
)*0.08;

camera.updateProjectionMatrix();



// COLLISION
let newX = camera.position.x + moveX;
let newZ = camera.position.z + moveZ;

if(!collides(newX,camera.position.z)){

    camera.position.x = newX;
}

if(!collides(camera.position.x,newZ)){

    camera.position.z = newZ;
}



// GRAVITY
velocityY -= 0.015;

camera.position.y += velocityY;

let targetHeight =
crouching ? 1.2 : 2;

if(camera.position.y <= targetHeight){

    camera.position.y = targetHeight;

    velocityY = 0;

    grounded = true;
}



// PICKUP KEYS
for(let i=items.length-1;i>=0;i--){

    if(
        camera.position.distanceTo(
            items[i].position
        ) < 5
    ){

        scene.remove(items[i]);

        collected++;

        if(collected <= 3){

            document.getElementById(
            "slot"+collected
            ).innerHTML = "KEY";
        }

        items.splice(i,1);
    }
}



// BATTERIES
for(let i=batteriesItems.length-1;i>=0;i--){

    if(
        camera.position.distanceTo(
            batteriesItems[i].position
        ) < 5
    ){

        scene.remove(batteriesItems[i]);

        batteries++;

        batteriesItems.splice(i,1);
    }
}



// SECRET ORB
if(
secretOrb &&
camera.position.distanceTo(
secretOrb.position
) < 6
){

    scene.remove(secretOrb);

    secretFound = true;

    secretOrb = null;
}



// MONSTER AI
let dx =
camera.position.x - monster.position.x;

let dz =
camera.position.z - monster.position.z;

let dist =
Math.sqrt(dx*dx + dz*dz);

let monsterSpeed =
running ? 0.08 : 0.06;

if(dist < 95){

    monster.position.x +=
    (dx/dist)*monsterSpeed;

    monster.position.z +=
    (dz/dist)*monsterSpeed;
}

monster.lookAt(camera.position);

monster.rotation.y +=
Math.sin(Date.now()*0.004)*0.02;



// DEATH
if(dist < 6){

    document.getElementById("msg").style.display =
    "block";

    document.getElementById("msg").style.color =
    "red";

    document.getElementById("msg").innerHTML =
    "YOU DIED";
}



// EXIT
exit.rotation.y += 0.03;



// NORMAL ENDING
if(
collected >= neededKeys &&
camera.position.distanceTo(exit.position) < 10 &&
batteries < 3 &&
!secretFound
){

    document.getElementById("msg").style.display =
    "block";

    document.getElementById("msg").style.color =
    "lime";

    document.getElementById("msg").innerHTML =
    "NORMAL ENDING";
}



// POWER ENDING
if(
collected >= neededKeys &&
camera.position.distanceTo(exit.position) < 10 &&
batteries >= 3
){

    document.getElementById("msg").style.display =
    "block";

    document.getElementById("msg").style.color =
    "cyan";

    document.getElementById("msg").innerHTML =
    "POWER ENDING";
}



// TRUE ENDING
if(
collected >= neededKeys &&
camera.position.distanceTo(exit.position) < 10 &&
secretFound
){

    document.getElementById("msg").style.display =
    "block";

    document.getElementById("msg").style.color =
    "magenta";

    document.getElementById("msg").innerHTML =
    "TRUE ENDING";
}



renderer.render(scene,camera);

}

animate();



// RESIZE
window.addEventListener("resize",()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});

</script>

</body>
</html>
